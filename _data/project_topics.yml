  - id: urban-mapping
    title: "Neural Radio Frequency Digital Twin"
    thesis_label: "PhD Thesis"
    start_year: 2024
    end_year: "now"
    description: >-
      We study neural radio frequency (RF) digital twins through 3D/4D scene reconstruction and RF propagation modeling from multimodal sensing data.
    publications:
      - 2026/2026-imwut-surfnehf
      - 2026/2026-wcl-urc-sim-reality
      - 2024/2024-globecom
    ongoing_projects:
